name: Friendly CICD Helper

on:
  pull_request:
    branches: [ main ]

jobs:
  pr_analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Git Diff
      id: git_diff
      run: |
        git diff origin/main...HEAD > diff.txt
        echo "Diff generated in diff.txt"
        cat diff.txt

    - name: Automated PR Review
      run: |
        export VERTEX_GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
        (
        echo "## Automated Pull Request Review Notes (generated by Vertex AI)"
        echo "_Note that the following notes do not replace a thorough code review by an expert:_"
        friendly-cicd-helper vertex-code-review --diff diff.txt
        ) | friendly-cicd-helper github-pr-comment --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Automated PR Summary
      run: |
        export VERTEX_GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
        (
        echo "## Automated Pull Request Summary Notes (generated by Vertex AI)"
        echo "_Note that the following notes do not replace a thorough code review by an expert:_"
        friendly-cicd-helper vertex-code-summary --diff diff.txt
        ) | friendly-cicd-helper github-pr-comment --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Automated Release Notes
      run: |
        export VERTEX_GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
        (
        echo "## Automated Suggestions for Release Notes (generated by Vertex AI)"
        friendly-cicd-helper vertex-release-notes --diff diff.txt
        ) | friendly-cicd-helper github-pr-comment --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Security Scan
      run: |
        (
        echo "## 🔒 Automated Security Scan Results"
        echo "_Security analysis performed using industry-standard tools: Bandit, Safety, and Semgrep_"
        echo ""
        friendly-cicd-helper security-scan --diff diff.txt --format text
        ) | friendly-cicd-helper github-pr-comment --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Test Intelligence Analysis
      run: |
        export VERTEX_GCP_PROJECT=${{ secrets.GCP_PROJECT_ID }}
        (
        echo "## 🧪 Test Intelligence Analysis"
        echo "_Automated test analysis using coverage.py, pytest, and AI-powered insights_"
        echo ""
        friendly-cicd-helper test-intelligence --diff diff.txt --format text --generate-tests --coverage-threshold 80
        ) | friendly-cicd-helper github-pr-comment --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
